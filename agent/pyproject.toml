[project]
name = "minus-tracker-agent"
version = "0.1.0"
description = "ADK conversational agent for minus-tracker — a pure MCPToolset client (PRD Part 20)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  # `mcp` extra pulls in the MCP Python SDK that `McpToolset` needs at
  # runtime — without it, importing google.adk.tools.mcp_tool fails.
  "google-adk[mcp]>=1.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<9.0.0", "pytest-asyncio>=0.24.0,<1.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minus_tracker_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = "."
